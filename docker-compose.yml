services:
    postgres:
        image: postgres:16-alpine
        container_name: lysmart_chat_postgres
        env_file:
            - .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-lysmart}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lysmart}
            POSTGRES_DB: ${POSTGRES_DB:-lysmart}
        ports:
            - '8888:5432'
        volumes:
            - lysmart_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lysmart} -d ${POSTGRES_DB:-lysmart}']
            interval: 5s
            timeout: 5s
            retries: 5

    lysmart:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '${SERVER_PORT:-5005}:${SERVER_PORT:-5005}'
        environment:
            # =================================================================
            # Chat Port
            # =================================================================
            SERVER_PORT: ${SERVER_PORT:-5005}

            # =================================================================
            # Authentication & API Keys
            # =================================================================
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

            # =================================================================
            # Slack Integration (optional)
            # =================================================================
            SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
            SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}

            # =================================================================
            # Database for LySmart chat history
            # =================================================================
            DB_URI: postgres://${POSTGRES_USER:-lysmart}:${POSTGRES_PASSWORD:-lysmart}@postgres:5432/${POSTGRES_DB:-lysmart}

            # =================================================================
            # Context Configuration
            # =================================================================
            # Option A: Local mode (default) - uses bundled example or volume mount
            LYSMART_CONTEXT_SOURCE: local
            LYSMART_DEFAULT_PROJECT_PATH: /app/example

            # Option B: Git mode - uncomment and configure these instead:
            # LYSMART_CONTEXT_SOURCE: git
            # LYSMART_CONTEXT_GIT_URL: https://github.com/your-org/your-lysmart-context.git
            # LYSMART_CONTEXT_GIT_BRANCH: main
            # LYSMART_CONTEXT_GIT_TOKEN: ${GITHUB_TOKEN}
            # LYSMART_DEFAULT_PROJECT_PATH: /app/context

            # Optional: Schedule periodic git pull (cron expression)
            # LYSMART_REFRESH_SCHEDULE: "0 * * * *"  # Every hour
        volumes:
            - ${LYSMART_DEFAULT_PROJECT_PATH}:/app/example
        depends_on:
            - postgres

volumes:
    lysmart_postgres_data:
